[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whatlongh-annotate_jd059"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出标注平台与数据质量工程师·KV Cache 复用与前缀共享上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "whatlongh" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://whatlongh.github.io"
Repository = "https://github.com/whatlongh/annotate_jd059"
Issues = "https://github.com/whatlongh/annotate_jd059/issues"

[project.scripts]
annotate_jd059 = "annotate_jd059:main"

[tool.setuptools]
py-modules = ["annotate_jd059"]
